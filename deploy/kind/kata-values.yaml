# Helm values for kata-deploy in a kind (KVM-capable) cluster.
#
# Only QEMU is enabled — the simplest shim that works with nested KVM
# (which kind nodes support when /dev/kvm is exposed from the host).
#
# kata-deploy DaemonSet will:
#   1. Copy kata binaries to /opt/kata/bin/ on the node
#   2. Patch /etc/containerd/config.toml to register the kata-qemu-runtime-rs runtime
#   3. Create the kata-qemu-runtime-rs RuntimeClass
k8sDistribution: k8s

# Kata 4.0 made the Rust runtime ("qemu-runtime-rs") the default on every arch
# that ships a runtime-rs build, and considers the Go runtime feature-frozen
# (see kata's docs/migrating-config-go-runtime-to-runtime-rs.md). We follow that
# default: runtime-rs supports guest_extension_images, which is how the hardened
# kata-agent policy reaches the guest.
shims:
  disableAll: true
  qemu-runtime-rs:
    enabled: true

# Must name a shim enabled above, or kata-deploy refuses to start:
#   Error: DEFAULT_SHIM '<x>' must be one of the configured SHIMS
#          for this architecture: [...]
# ppc64le ships no runtime-rs build, so it stays on the Go runtime.
defaultShim:
  amd64: qemu-runtime-rs
  arm64: qemu-runtime-rs
  s390x: qemu-runtime-rs
  ppc64le: qemu

# Let kata-deploy manage RuntimeClass creation.
# We add a separate kata-nono-sandbox RC (same handler) in runtimeclass.yaml.
runtimeClasses:
  enabled: true
