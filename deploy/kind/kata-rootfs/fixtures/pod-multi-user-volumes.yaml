# Legitimate pod with multiple user volumes at /data and /config.
# Neither /data nor /config touches the /nono prefix.
# CreateContainerRequest must be ALLOWED (nono_prefix mount count == 1).
apiVersion: v1
kind: Pod
metadata:
  name: pod-multi-user-volumes
  namespace: default
  annotations:
    nono.sh/profile: default
spec:
  runtimeClassName: kata-nono-sandbox
  restartPolicy: Never
  containers:
    - name: app
      image: alpine:3.20
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config
          readOnly: true
  volumes:
    - name: data
      emptyDir: {}
    - name: config
      configMap:
        name: app-config
