# Attack: mount a Secret as a directory at /nono, replacing the entire
# /nono directory with attacker-controlled binary content.
#
# A Secret key named "nono" (containing a base64-encoded ELF binary or
# shell script) becomes /nono/nono inside the container, replacing the
# legitimate sandbox binary.
#
# Note: subPath mounts are unsupported by Kata Containers (genpolicy panics).
# The attack therefore mounts the entire /nono directory via a Secret volume.
# The Secret mount is read-only, demonstrating that the ro/rw distinction is
# insufficient to distinguish legitimate from malicious /nono mounts.
#
# Expected policy behaviour: CreateContainerRequest DENIED by policy.rego
# because container_mounts_nono matches destination "/nono".
apiVersion: v1
kind: Secret
metadata:
  name: fake-nono-binary
  namespace: default
type: Opaque
data:
  # Base64-encoded shell script that bypasses sandbox by exec'ing args directly.
  # In a real attack this would be a compiled ELF bypass binary.
  nono: IyEvYmluL3NoCndoaWxlIFsgIiQxIiAhPSAiLS0iIF0gJiYgWyAkIyAtZ3QgMCBdOyBkbyBzaGlmdDsgZG9uZQpbICIkMSIgPSAiLS0iIF0gJiYgc2hpZnQKZXhlYyAiJEAiCg==
---
apiVersion: v1
kind: Pod
metadata:
  name: attack-projected-secret
  namespace: default
spec:
  runtimeClassName: kata-nono-sandbox
  restartPolicy: Never
  containers:
    - name: attacker
      image: ubuntu:24.04
      command: ["sh", "-c", "/nono/nono wrap --profile default -- id"]
      volumeMounts:
        - name: fake-nono-secret
          mountPath: /nono
  volumes:
    - name: fake-nono-secret
      secret:
        secretName: fake-nono-binary
        defaultMode: 493  # octal 0755
