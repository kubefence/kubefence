{{- if .Values.kata.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubefence.fullname" . }}-kata-setup
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubefence.labels" . | nindent 4 }}
    app.kubernetes.io/component: kata-setup
spec:
  selector:
    matchLabels:
      {{- include "kubefence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kata-setup
  template:
    metadata:
      labels:
        {{- include "kubefence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kata-setup
    spec:
      automountServiceAccountToken: false
      initContainers:

        # ── 1. Wait for kata-deploy ──────────────────────────────────────────
        # kata-deploy must install its binaries and write the QEMU config file
        # before we patch it.  Poll until the file appears.
        - name: wait-for-kata
          image: {{ .Values.helperImages.busybox | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for kata QEMU config at {{ .Values.kata.qemuConfigPath }}..."
              until [ -f "{{ .Values.kata.qemuConfigPath }}" ]; do
                sleep 5
              done
              echo "kata QEMU config ready."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kata-config-dir
              mountPath: {{ .Values.kata.qemuConfigPath | dir }}
              readOnly: true

        # ── 2. Install the nono guest extension image ────────────────────────
        # The kata-nono-extension image (FROM scratch + static /bin/cp) copies
        # /kata-nono-extension.img to the destination. command+args are set
        # explicitly rather than relying on ENTRYPOINT so the intent is clear in
        # kubectl describe and the chart is not fragile to image metadata changes.
        - name: install-kata-extension
          image: {{ .Values.kata.extensionImage | quote }}
          command: ["/bin/cp", "/kata-nono-extension.img"]
          args:
            - {{ printf "%s/kata-nono-extension.img" .Values.kata.shareDir | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kata-share
              mountPath: {{ .Values.kata.shareDir }}

        # ── 3. Patch kata config and register containerd handler ─────────────
        # Privileged so it can write to host-owned kata config files and send
        # SIGHUP to containerd for config reload without a full restart.
        - name: configure-kata
          image: {{ .Values.helperImages.alpine | quote }}
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              KATA_CFG="{{ .Values.kata.qemuConfigPath }}"
              SHARE_DIR="{{ .Values.kata.shareDir }}"
              NONO_EXT="${SHARE_DIR}/kata-nono-extension.img"
              AGENT_CFG="/run/kata-extensions/nono/agent-config.toml"
              KATA_CFG_DIR="$(dirname ${KATA_CFG})"
              KATA_CFG_NONO="${KATA_CFG_DIR}/configuration-kata-nono-qemu.toml"
              CONTAINERD_CFG="{{ .Values.containerdConfigPath }}"

              # The stock kata guest kernel already has CONFIG_SECURITY_LANDLOCK=y
              # (kata >= 4.0), so `kernel =` is left exactly as kata-deploy wrote it.
              {{- if .Values.kata.qemu.machineAccelerators }}
              # Set machine_accelerators (update existing line or insert after [hypervisor.qemu]).
              if grep -q '^machine_accelerators' "${KATA_CFG}"; then
                sed -i "s|^machine_accelerators = .*|machine_accelerators = \"{{ .Values.kata.qemu.machineAccelerators }}\"|" "${KATA_CFG}"
              else
                sed -i "s|\(\[hypervisor\.qemu\]\)|\1\nmachine_accelerators = \"{{ .Values.kata.qemu.machineAccelerators }}\"|" "${KATA_CFG}"
              fi
              echo "Set machine_accelerators in ${KATA_CFG}."
              {{- end }}

              # ── Create kata-nono-qemu config: base + the nono extension ────
              # Inherits everything from the base runtime-rs config, including the
              # stock guest image and kernel, which are left untouched.
              cp "${KATA_CFG}" "${KATA_CFG_NONO}"

              # Point kata-agent at the OPA policy shipped in the extension.
              # Appended to kernel_params, never replacing it. Note the agent
              # stops parsing the command line at agent.config_file, so any
              # other agent.* setting must go inside agent-config.toml instead.
              if grep -q '^kernel_params' "${KATA_CFG_NONO}"; then
                sed -i "s|^kernel_params = \"\(.*\)\"|kernel_params = \"\1 agent.config_file=${AGENT_CFG}\"|" "${KATA_CFG_NONO}"
              else
                sed -i "s|\(\[hypervisor\.qemu\]\)|\1\nkernel_params = \"agent.config_file=${AGENT_CFG}\"|" "${KATA_CFG_NONO}"
              fi
              grep -q "agent.config_file=${AGENT_CFG}" "${KATA_CFG_NONO}" || {
                echo "ERROR: failed to add agent.config_file to ${KATA_CFG_NONO}" >&2
                grep -n 'kernel_params' "${KATA_CFG_NONO}" >&2 || true
                exit 1
              }

              # Cold-plug the extension as a read-only virtio-blk device.
              # verity_params is empty: the extension ships no dm-verity hash
              # partition, so kata-extension-mount.sh raw-mounts it. The entry
              # is still what activates the guest-side mount unit, so it must be
              # present even with an empty value.
              cat >> "${KATA_CFG_NONO}" <<EXTEOF

              [[hypervisor.qemu.guest_extension_images]]
              name = "nono"
              path = "${NONO_EXT}"
              verity_params = ""
              EXTEOF
              echo "Created ${KATA_CFG_NONO} (extension → ${NONO_EXT})."

              {{- if .Values.kata.qemu.seccompSandbox }}
              # ── Apply QEMU process-level seccomp sandbox ──────────────────
              # Restricts syscalls the QEMU process can make on the host.
              # spawn=deny prevents QEMU from exec'ing host binaries after a
              # hypothetical VM escape; elevateprivileges=deny prevents setuid.
              if grep -q '^seccompsandbox' "${KATA_CFG_NONO}"; then
                sed -i "s|^seccompsandbox = .*|seccompsandbox = \"{{ .Values.kata.qemu.seccompSandbox }}\"|" "${KATA_CFG_NONO}"
              else
                sed -i "s|\(\[hypervisor\.qemu\]\)|\1\nseccompsandbox = \"{{ .Values.kata.qemu.seccompSandbox }}\"|" "${KATA_CFG_NONO}"
              fi
              echo "Set seccompsandbox in ${KATA_CFG_NONO}."
              {{- end }}

              # ── Enable guest seccomp so kata-agent applies OCI profiles ───
              # disable_guest_seccomp = false means "do NOT disable" = enabled.
              # Required for the NRI-injected seccomp_profile to take effect
              # inside the Kata VM (kata-agent reads and applies the OCI spec
              # seccomp field, which NRI writes via SetLinuxSeccompPolicy).
              if grep -q '^disable_guest_seccomp' "${KATA_CFG_NONO}"; then
                sed -i "s|^disable_guest_seccomp = .*|disable_guest_seccomp = {{ .Values.kata.qemu.disableGuestSeccomp }}|" "${KATA_CFG_NONO}"
              else
                sed -i "s|^\\[hypervisor\\.qemu\\]|[hypervisor.qemu]\\ndisable_guest_seccomp = {{ .Values.kata.qemu.disableGuestSeccomp }}|" "${KATA_CFG_NONO}"
              fi
              echo "Set disable_guest_seccomp = {{ .Values.kata.qemu.disableGuestSeccomp }} in ${KATA_CFG_NONO}."

              # ── Register kata-nono-qemu handler in containerd config ───────
              # Idempotent: skip if stanza already present.
              if [ ! -f "${CONTAINERD_CFG}" ]; then
                echo "Warning: containerd config not found at ${CONTAINERD_CFG} — skipping handler registration."
              elif grep -q 'runtimes\.kata-nono-qemu' "${CONTAINERD_CFG}"; then
                echo "kata-nono-qemu already registered in ${CONTAINERD_CFG}."
              else
                cat >> "${CONTAINERD_CFG}" << TOMLEOF

              [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.kata-nono-qemu]
                runtime_type = "io.containerd.kata-qemu-runtime-rs.v2"
                runtime_path = "/opt/kata/runtime-rs/bin/containerd-shim-kata-v2"
                privileged_without_host_devices = true
                pod_annotations = ["io.katacontainers.*"]
                [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.kata-nono-qemu.options]
                  ConfigPath = "${KATA_CFG_NONO}"
              TOMLEOF
                echo "Registered kata-nono-qemu in ${CONTAINERD_CFG}."

                # ── Reload containerd config via SIGHUP ──────────────────────
                CONTAINERD_PID=$(cat /run/containerd/containerd.pid 2>/dev/null || true)
                if [ -n "${CONTAINERD_PID}" ]; then
                  kill -HUP "${CONTAINERD_PID}" \
                    && echo "Sent SIGHUP to containerd (PID ${CONTAINERD_PID})." \
                    || echo "Warning: SIGHUP failed — manual containerd reload may be needed."
                else
                  echo "Warning: containerd PID not found — manual reload required."
                fi
              fi
          volumeMounts:
            - name: kata-share
              mountPath: {{ .Values.kata.shareDir }}
            - name: kata-config-dir
              mountPath: {{ .Values.kata.qemuConfigPath | dir }}
            - name: containerd-config-dir
              mountPath: {{ .Values.containerdConfigPath | dir }}
            - name: run-containerd
              mountPath: /run/containerd
              readOnly: true

      # Long-running container keeps the pod alive so DaemonSet rollout status
      # reflects node readiness and kubectl can inspect logs.
      containers:
        - name: kata-setup-complete
          image: {{ .Values.helperImages.busybox | quote }}
          command: ["/bin/sh", "-c", "echo 'kata node setup complete'; sleep infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}

      volumes:
        - name: kata-share
          hostPath:
            path: {{ .Values.kata.shareDir }}
            type: DirectoryOrCreate
        - name: kata-config-dir
          hostPath:
            path: {{ .Values.kata.qemuConfigPath | dir }}
            type: DirectoryOrCreate
        - name: containerd-config-dir
          hostPath:
            path: {{ .Values.containerdConfigPath | dir }}
            type: DirectoryOrCreate
        - name: run-containerd
          hostPath:
            path: /run/containerd
            type: DirectoryOrCreate
{{- end }}
