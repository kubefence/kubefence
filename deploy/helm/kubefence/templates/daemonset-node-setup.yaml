{{- if .Values.nodeSetup.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubefence.fullname" . }}-node-setup
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubefence.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-setup
spec:
  selector:
    matchLabels:
      {{- include "kubefence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-setup
  template:
    metadata:
      labels:
        {{- include "kubefence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node-setup
    spec:
      automountServiceAccountToken: false
      # Needed for `nsenter -t 1` to reach the host's PID 1, and through it the
      # host's systemd, to restart containerd after patching its config.
      hostPID: true
      initContainers:

        # ── Patch containerd config ──────────────────────────────────────────
        # Idempotently enables the NRI subsystem and registers the nono-runc
        # runtime handler, then restarts containerd so both take effect. Both
        # changes are required for nono-nri to work with the runc runtime:
        #   - NRI: lets the plugin connect and receive container lifecycle events
        #   - nono-runc handler: lets Kubernetes schedule pods with
        #     runtimeClassName: nono-runc
        - name: configure-containerd
          image: {{ .Values.helperImages.alpine | quote }}
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              CFG="{{ .Values.containerdConfigPath }}"
              READY="{{ .Values.hostPaths.readyDir }}/node-setup.done"

              # Retract the marker first: from here until the marker is rewritten
              # this node may restart containerd, and the plugin must not be
              # connecting through that. See hostPaths.readyDir in values.yaml.
              mkdir -p "$(dirname ${READY})"
              rm -f "${READY}"

              if [ ! -f "${CFG}" ]; then
                echo "containerd config not found at ${CFG} — skipping."
                touch "${READY}"
                exit 0
              fi

              CHANGED=false
              DROPIN_DIR="{{ .Values.containerdConfigPath | dir }}/conf.d"
              DROPIN="${DROPIN_DIR}/40-nono-runc.toml"
              DROPIN_GLOB="${DROPIN_DIR}/*.toml"

              {{- include "kubefence.criPluginName" . | nindent 14 }}

              # ── NRI + the nono-runc handler, as one conf.d drop-in ─────────
              # conf.d is containerd's own drop-in directory: a stock 2.x config
              # already imports it and kata-deploy writes its handler there, so on
              # a stock node config.toml needs no edit at all.
              #
              # A drop-in rather than an append to config.toml: rewriting a file
              # we own is idempotent by construction, cannot collide with the
              # kata-setup DaemonSet writing the same file, and can be undone by
              # deleting it. containerd merges imports over the main config, so
              # this also re-enables NRI if the base config disabled it.
              mkdir -p "${DROPIN_DIR}"
              cat > /tmp/dropin.toml << TOMLEOF
              [plugins."io.containerd.nri.v1.nri"]
                disable = false
                socket_path = "{{ .Values.nodeSetup.nri.socketPath }}"
                plugin_path = "{{ .Values.nodeSetup.nri.pluginPath }}"
                plugin_config_path = "{{ .Values.nodeSetup.nri.configPath }}"

              [plugins."${CRI_PLUGIN}".containerd.runtimes.nono-runc]
                runtime_type = "io.containerd.runc.v2"
              TOMLEOF
              if cmp -s /tmp/dropin.toml "${DROPIN}"; then
                echo "${DROPIN} already up to date."
              else
                cat /tmp/dropin.toml > "${DROPIN}"
                echo "Wrote ${DROPIN} (NRI + nono-runc)."
                CHANGED=true
              fi
              rm -f /tmp/dropin.toml

              {{- include "kubefence.ensureImportsGlob" . | nindent 14 }}

              # ── Restart containerd if anything changed ─────────────────────
              # A supervised restart through the host's systemd. Not SIGHUP:
              # containerd does not handle it, so the default disposition kills
              # the daemon and the node only recovers if the unit happens to set
              # Restart=always. Enabling NRI needs a restart anyway — plugins are
              # only initialised at startup. The restart also kills this init
              # container; the DaemonSet retries it and the retry finds both
              # changes already applied and exits without restarting again.
              if [ "${CHANGED}" = "true" ]; then
                nsenter -t 1 -m -u -i -n -p -- systemctl restart containerd \
                  || echo "Warning: containerd restart failed — restart manually."
              fi

              # Publish the marker last. The restart above kills this container
              # before it gets here, so the marker is only written on the retry
              # that finds everything already applied and restarts nothing — which
              # is exactly the point at which the plugin may safely connect.
              touch "${READY}"
              echo "node setup complete."
          volumeMounts:
            - name: containerd-config-dir
              mountPath: {{ .Values.containerdConfigPath | dir }}
            - name: ready-dir
              mountPath: {{ .Values.hostPaths.readyDir }}

      # Long-running container keeps the pod alive for status tracking.
      containers:
        - name: node-setup-complete
          image: {{ .Values.helperImages.busybox | quote }}
          command: ["/bin/sh", "-c", "echo 'node setup complete'; sleep infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}

      volumes:
        - name: containerd-config-dir
          hostPath:
            path: {{ .Values.containerdConfigPath | dir }}
            type: DirectoryOrCreate
        - name: ready-dir
          hostPath:
            path: {{ .Values.hostPaths.readyDir }}
            type: DirectoryOrCreate
{{- end }}
