apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubefence.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubefence.labels" . | nindent 4 }}
data:
  10-nono-nri.toml: |
    runtime_classes = {{ .Values.config.runtimeClasses | toJson }}
    default_profile = {{ .Values.config.defaultProfile | quote }}
    nono_bin_path = {{ .Values.config.nonoBinPath | quote }}
    socket_path = {{ .Values.config.socketPath | quote }}
    seccomp_profile = {{ .Values.config.seccompProfile | quote }}
