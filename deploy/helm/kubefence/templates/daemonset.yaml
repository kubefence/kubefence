apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kubefence.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubefence.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugin
spec:
  selector:
    matchLabels:
      {{- include "kubefence.selectorLabels" . | nindent 6 }}
      # The setup DaemonSets carry the same selectorLabels plus their own
      # component, so without one here this selector is a strict subset of
      # theirs: `kubectl logs ds/kubefence` resolves to a setup pod, and
      # `-l app.kubernetes.io/name=kubefence` matches all three.
      #
      # A DaemonSet selector is immutable, so adding this is an uninstall/reinstall
      # for anyone on a chart that lacked it — see docs/upgrading.md.
      app.kubernetes.io/component: plugin
  template:
    metadata:
      labels:
        {{- include "kubefence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: plugin
    spec:
      automountServiceAccountToken: false
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "kubefence.fullname" . }}
      {{- end }}
      initContainers:
        {{- if or .Values.nodeSetup.enabled .Values.kata.enabled }}

        # ── Wait for node setup to finish ────────────────────────────────────
        # The setup DaemonSets restart containerd to load their drop-ins. A
        # restart under a running plugin drops its NRI connection, and although
        # the plugin reconnects on its own, every pod created in that window
        # starts with no nono wrapper and no seccomp profile — silently, since
        # the pod itself comes up fine. Kubernetes has no cross-DaemonSet
        # ordering, so gate on the markers the setup DaemonSets publish once they
        # are done restarting anything.
        #
        # Times out rather than blocking forever: a plugin that starts late still
        # converges, whereas one that never starts protects nothing.
        - name: wait-for-node-setup
          image: {{ .Values.helperImages.busybox | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              READY_DIR="{{ .Values.hostPaths.readyDir }}"
              WAIT=300
              _i=0
              while [ "${_i}" -lt "${WAIT}" ]; do
                ok=true
                {{- if .Values.nodeSetup.enabled }}
                [ -f "${READY_DIR}/node-setup.done" ] || ok=false
                {{- end }}
                {{- if .Values.kata.enabled }}
                [ -f "${READY_DIR}/kata-setup.done" ] || ok=false
                {{- end }}
                # containerd only creates the socket once NRI is enabled, which
                # is itself one of the things node setup turns on.
                [ -S /var/run/nri/nri.sock ] || ok=false
                if [ "${ok}" = "true" ]; then
                  echo "node setup complete and NRI socket present after ${_i}s."
                  exit 0
                fi
                [ $((_i % 30)) -eq 0 ] && [ "${_i}" -gt 0 ] && \
                  echo "    still waiting for node setup... (${_i}s)"
                _i=$((_i + 1))
                sleep 1
              done
              echo "WARNING: node setup markers not present after ${WAIT}s — starting anyway." >&2
              echo "         Pods created before the plugin connects will not be sandboxed." >&2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ready-dir
              mountPath: {{ .Values.hostPaths.readyDir }}
              readOnly: true
            - name: nri-socket
              mountPath: /var/run/nri
              readOnly: true
        {{- end }}

        - name: install-nono
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              chmod 0700 /opt/nono-nri
              cp /usr/local/bin/nono /opt/nono-nri/nono
              chmod 0755 /opt/nono-nri/nono
              # Generate wrapper scripts for common interpreters.
              # These land at /nono/{sh,bash,...} inside containers (via the
              # bind-mount of /opt/nono-nri -> /nono) and are found first when
              # the NRI plugin prepends /nono to the container's PATH.
              # Each wrapper calls nono wrap so kubectl exec is sandboxed too.
              for pair in \
                "sh:/bin/sh" \
                "bash:/bin/bash" \
                "ash:/bin/ash" \
                "dash:/bin/dash" \
                "python3:/usr/bin/python3" \
                "python:/usr/bin/python" \
                "node:/usr/bin/node" \
                "ruby:/usr/bin/ruby" \
                "perl:/usr/bin/perl"; do
                name="${pair%%:*}"
                real="${pair##*:}"
                printf '#!/bin/sh\nexec /nono/nono wrap --profile "${NONO_PROFILE:-default}" -- %s "$@"\n' \
                  "$real" > "/opt/nono-nri/$name"
                chmod 0755 "/opt/nono-nri/$name"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nono-host-dir
              mountPath: /opt/nono-nri
            - name: nri-plugins-dir
              mountPath: /opt/nri/plugins
      containers:
        - name: nono-nri
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/10-nono-nri
            - --config
            - /etc/nri/conf.d/10-nono-nri.toml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nri-socket
              mountPath: /var/run/nri
              readOnly: true
            - name: nono-host-dir
              mountPath: /opt/nono-nri
              readOnly: true
            - name: nri-config
              mountPath: /etc/nri/conf.d
              readOnly: true
            - name: nono-state
              mountPath: /var/run/nono-nri
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      volumes:
        - name: nri-socket
          hostPath:
            path: {{ .Values.hostPaths.nriSocket }}
            type: DirectoryOrCreate
        - name: nono-host-dir
          hostPath:
            path: {{ .Values.hostPaths.nonoHostDir }}
            type: DirectoryOrCreate
        - name: nri-config
          configMap:
            name: {{ include "kubefence.fullname" . }}-config
        - name: nri-plugins-dir
          hostPath:
            path: {{ .Values.hostPaths.nriPlugins }}
            type: DirectoryOrCreate
        - name: nono-state
          hostPath:
            path: /var/run/nono-nri
            type: DirectoryOrCreate
        {{- if or .Values.nodeSetup.enabled .Values.kata.enabled }}
        - name: ready-dir
          hostPath:
            path: {{ .Values.hostPaths.readyDir }}
            type: DirectoryOrCreate
        {{- end }}
