apiVersion: v1
kind: Pod
metadata:
  name: nono-test
  namespace: default
  annotations:
    nono.sh/profile: "default"
spec:
  runtimeClassName: kata-nono-sandbox
  restartPolicy: Never
  containers:
    # glibc image on purpose: the shipped nono is glibc-linked, so on a musl
    # image (alpine, busybox-uclibc) it fails to start and the container exits
    # with code 2 and no logs.
    - name: test
      image: debian:12-slim
      command: ["sleep", "infinity"]
