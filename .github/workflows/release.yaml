name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      nono_version:
        description: "nono release tag to embed (e.g. v0.71.0). Defaults to NONO_VERSION below."
        required: false
        default: ""

# Default nono release to embed. Update when a new nono is released — and update
# the pinned checksum in scripts/fetch-nono.sh with it.
env:
  NONO_VERSION: v0.71.0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nono-nri-plugin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve nono version
        id: nono
        env:
          INPUT_VERSION: ${{ inputs.nono_version }}
        run: |
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ env.NONO_VERSION }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Embedding nono release: $VERSION"

      - name: Fetch nono binary from the upstream release
        env:
          NONO_VERSION: ${{ steps.nono.outputs.version }}
          OUT: ${{ github.workspace }}/nono
        run: bash scripts/fetch-nono.sh

      - name: Verify binary dependencies
        run: |
          echo "nono binary: $(file ./nono)"
          echo "size: $(du -sh ./nono | cut -f1)"
          echo "ldd:"
          ldd ./nono

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # On release: tag with semver (v1.2.3 → 1.2.3 and 1.2) + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            # On manual dispatch: tag with nono version for traceability
            type=raw,value=nono-${{ steps.nono.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
