name: kata-nono-extension

# Builds the nono guest extension image — a kata composable-VM-images extension
# carrying the hardened kata-agent OPA policy — and publishes it to GHCR.
#
# Image: ghcr.io/<owner>/kata-nono-extension:<ref>
#
# The extension is independent of both the kata and nono versions: it contains
# only policy.rego and agent-config.toml, and the stock kata guest image is used
# unmodified. It is therefore tagged by the git ref that produced it, not by a
# kata/nono version pair, and is rebuilt whenever its inputs change.

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "deploy/kind/kata-extension/Dockerfile"
      - "deploy/kind/kata-extension/policy.rego"
      - "deploy/kind/kata-extension/policy_test.rego"
      - "deploy/kind/kata-extension/agent-config.toml"
      - ".github/workflows/kata-extension.yaml"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/kata-nono-extension

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          # Releases publish the release tag; branch pushes publish the short sha.
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: deploy/kind/kata-extension
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
