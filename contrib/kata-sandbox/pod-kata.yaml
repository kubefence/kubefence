apiVersion: v1
kind: Pod
metadata:
  name: kata-nono-demo
  namespace: default
  labels:
    app: nono-kata-demo
    mode: kata-sandbox
spec:
  runtimeClassName: kata-nono-sandbox
  restartPolicy: Never
  containers:
    - name: demo
      image: python:3.11.15-trixie
      imagePullPolicy: IfNotPresent
      # NRI injects nono at container creation time inside the Kata VM:
      #   /nono/nono wrap --profile default -- sleep infinity
      # nono applies Landlock, then exec()s into sleep — PID 1 is sandboxed.
      command: ["sleep", "infinity"]
